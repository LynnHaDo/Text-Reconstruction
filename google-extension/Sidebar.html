<!DOCTYPE html>
<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
        <title>Suggestions</title>
        <style>
            *, body {
                font-family: "Inter", sans-serif;
                font-optical-sizing: auto;
                font-style: normal;
                background: none;
            }
            h4 {
                font-weight: 500;
                margin-bottom: 1em;
            }
            .suggestions:hover {
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <h4 id="title"></h4>
        <ul id="suggestions" class="list-group list-group-flush"></ul>
        <script>
            google.script.run.withSuccessHandler((suggestions) => {
            const ulContent = document.getElementById("suggestions")
            const titleElement = document.getElementById("title")
            ulContent.innerHTML = ""
            titleElement.innerHTML = "Awaiting results..."

            suggestions.forEach((word) => {
                const listItem = document.createElement("li")
                listItem.className = "suggestions list-group-item bg-transparent"
                listItem.textContent = word 

                listItem.onclick = () => {
                    google.script.run.replaceText(word)
                }

                ulContent.appendChild(listItem)
            })

            titleElement.innerHTML = `Top ${suggestions.length} suggestions`
            }).getSuggestions()
        </script>
    </body>
</html>
